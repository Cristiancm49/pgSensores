name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: ruff check app tests
        working-directory: backend
      - run: pytest -q
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  mqtt-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start real PostgreSQL, Mosquitto and app
        run: docker compose up -d --build
      - name: Wait for API, PostgreSQL and MQTT readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:18000/api/health/ready | grep -q '"mqtt":"connected"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs backend mosquitto postgres
          exit 1
      - name: Verify telemetry, commands, ACK and disconnects
        env:
          PYTHONIOENCODING: utf-8
        run: python simulator/verify_stack.py --confirm-write
      - name: Show service logs after failure
        if: failure()
        run: docker compose logs --tail 250 backend mosquitto postgres
      - name: Stop stack
        if: always()
        run: docker compose down -v

  firmware-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated Arduino runner
        run: docker build -t udlaiot-firmware-runner:local firmware-runner
      - name: Compile and execute Blink with simavr
        run: python simulator/run_firmware.py simulator/examples/Blink.ino --engine simavr --timeout 20
