name: Ciclo automático de invernadero ESP32
steps:
  - at_seconds: 30
    action: ramp
    channel: temperatura
    from: 24
    to: 32
    duration_seconds: 60
  - at_seconds: 45
    action: ramp
    channel: humedad_suelo
    from: 65
    to: 30
    duration_seconds: 90
  - at_seconds: 75
    action: fault
    faults:
      latency_ms: 600
  - at_seconds: 105
    action: fault
    faults:
      latency_ms: 0
  - at_seconds: 120
    action: sequence
    channel: humedad_aire
    values: [62, 58, 54, 66]
    interval_seconds: 20
  - at_seconds: 210
    action: set
    values:
      temperatura: 25
      humedad_aire: 66
      humedad_suelo: 72

