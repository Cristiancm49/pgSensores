services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexiot}
      POSTGRES_USER: ${POSTGRES_USER:-nexiot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "55478:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexiot} -d ${POSTGRES_DB:-nexiot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    environment:
      MQTT_ADMIN_USERNAME: ${MQTT_ADMIN_USERNAME:-nexiot-admin}
      MQTT_ADMIN_PASSWORD: ${MQTT_ADMIN_PASSWORD:-development-mqtt-admin-change-me}
    command:
      - /bin/sh
      - -c
      - |
        if [ ! -f /mosquitto/data/dynamic-security.json ]; then
          mosquitto_ctrl dynsec init /mosquitto/data/dynamic-security.json "$${MQTT_ADMIN_USERNAME}" "$${MQTT_ADMIN_PASSWORD}"
        fi
        mosquitto_ctrl -f /mosquitto/data/dynamic-security.json dynsec setClientPassword "$${MQTT_ADMIN_USERNAME}" "$${MQTT_ADMIN_PASSWORD}"
        chown mosquitto:mosquitto /mosquitto/data/dynamic-security.json
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    ports:
      - "11883:1883"
      - "19001:9001"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mqtt/data:/mosquitto/data
      - ./mqtt/log:/mosquitto/log

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nexiot}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-nexiot}
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me-use-32-chars}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-Administrador UDLAIoT}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_ADMIN_USERNAME: ${MQTT_ADMIN_USERNAME:-nexiot-admin}
      MQTT_ADMIN_PASSWORD: ${MQTT_ADMIN_PASSWORD:-development-mqtt-admin-change-me}
      MQTT_BACKEND_USERNAME: ${MQTT_BACKEND_USERNAME:-nexiot-backend}
      MQTT_BACKEND_PASSWORD: ${MQTT_BACKEND_PASSWORD:-development-mqtt-backend-change-me}
      MQTT_PUBLIC_HOST: ${MQTT_PUBLIC_HOST:-localhost}
      MQTT_PUBLIC_PORT: ${MQTT_PUBLIC_PORT:-11883}
      MQTT_PUBLIC_WEBSOCKET_PORT: ${MQTT_PUBLIC_WEBSOCKET_PORT:-19001}
      STORAGE_PATH: /app/storage
    ports:
      - "18000:8000"
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:18000
      VITE_WS_URL: ws://localhost:18000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "15173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
